name: shadowbox-coach eval gate

on:
  pull_request:
    paths:
      - "blueprints/shadowbox-coach/**"
  push:
    branches: [main]
    paths:
      - "blueprints/shadowbox-coach/**"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests + eval regression gate
        working-directory: blueprints/shadowbox-coach/app
        run: node check.mjs
