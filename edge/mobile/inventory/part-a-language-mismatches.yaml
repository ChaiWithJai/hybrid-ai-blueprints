pattern: >
  Apps localize where money is earned, not where it is needed. Gulf
  remittance-sender apps ship 10-18 languages; mandatory government apps and
  receiving-side finance apps ship 1-2. The chart position is held in the
  colonial or state language; the household speaks something else. The
  dictation-compose and read-aloud capabilities do not need the incumbent to
  fix its UI — they wrap it.
