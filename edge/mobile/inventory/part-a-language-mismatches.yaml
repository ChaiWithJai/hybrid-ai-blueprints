# Part A — Language-mismatch inventory
#
# Where a country's top apps are not in the language its people actually
# speak. Each entry is a named opportunity: the app holds the chart
# position, the language holds the people, and nothing connects them.
#
# Compiled 2026-08-31 from six parallel research sweeps. Chart positions
# are Similarweb/Appfigures snapshots dated 2026-08-29/31 — a week of
# data, not a trend. Speaker counts are approximate. Entries marked
# `verified: listing` were audited from store listings, not in-app
# screenshots. Full sources: docs/../The Kill Sheet artifact and the
# per-region sweep reports.
#
# serve_tier: how a 1.7B on-device model reaches the language today
#   generative   — servable by the LLM directly (Qwen3-class coverage)
#   lora         — marginal; one per-language LoRA fine-tune away
#   sidecar      — NLLB-200-600M translation only; LLM cannot generate it
#   none         — not reachable at 1.7B today (honest deferral)

