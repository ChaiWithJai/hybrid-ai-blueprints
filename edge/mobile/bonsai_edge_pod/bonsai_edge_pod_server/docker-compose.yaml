services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "9432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bonsai_edge_pod
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env — see .env.example}"
    volumes:
      - bonsai_edge_pod_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "9379:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:?set in .env — see .env.example}"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bonsai_edge_pod_test
      POSTGRES_PASSWORD: "${POSTGRES_TEST_PASSWORD:?set in .env — see .env.example}"
    volumes:
      - bonsai_edge_pod_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "${REDIS_TEST_PASSWORD:?set in .env — see .env.example}"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  bonsai_edge_pod_data:
  bonsai_edge_pod_test_data:
