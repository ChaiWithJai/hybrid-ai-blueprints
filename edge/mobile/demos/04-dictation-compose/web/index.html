<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bol</title>
<link rel="stylesheet" href="/tokens.css">
<style>
  .shell { max-width: 430px; margin: 0 auto; min-height: 100vh;
           display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 18px 20px 10px; }
  header h1 { font-size: var(--fs-hero); margin: 0; letter-spacing: -0.01em; }
  header .tag { font-size: var(--fs-meta); color: var(--ink-soft); }
  .made-chip { display: inline-flex; align-items: center; gap: 6px;
               font-size: var(--fs-meta); font-weight: 600;
               background: var(--sky-soft); color: var(--sky);
               border-radius: var(--radius-chip); padding: 7px 14px; }
  .made-chip svg { width: 16px; height: 16px; }
  .net-pill { margin-left: auto; display: flex; align-items: center; gap: 7px;
              font-size: var(--fs-meta); font-weight: 600;
              border-radius: var(--radius-chip); padding: 7px 14px; }
  .net-pill.on  { background: var(--leaf-soft); color: var(--leaf); }
  .net-pill.off { background: var(--wait-soft); color: var(--wait); }

  .offline-banner { display: none; margin: 0 16px 6px; padding: 12px 16px;
                    border-radius: var(--radius); background: var(--wait-soft);
                    color: var(--wait); font-size: var(--fs-meta);
                    align-items: center; gap: 10px; }
  body.offline .offline-banner { display: flex; }

  main { flex: 1; padding: 8px 16px 150px; display: flex;
         flex-direction: column; gap: 14px; }

  .empty { text-align: center; padding: 44px 24px; color: var(--ink-soft); }
  .empty .sprite-lg { width: 128px; height: 128px; }
  .empty p { margin: 6px 0; }

  .card { background: var(--card); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 16px;
          display: flex; flex-direction: column; gap: 12px; }
  .who { display: flex; align-items: center; gap: 12px; }
  .who .sprite { width: 52px; height: 52px; flex-shrink: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px;
          font-size: var(--fs-meta); font-weight: 600;
          border-radius: var(--radius-chip); padding: 6px 12px; }
  .chip svg { width: 16px; height: 16px; }
  .chip.register { background: var(--sand); color: var(--ink-soft); }
  .chip.arrived { background: var(--leaf-soft); color: var(--leaf); }

  .msg { font-size: var(--fs-hero); line-height: 1.45; margin: 0;
         overflow-wrap: break-word; }

  .made-line { display: flex; align-items: center; gap: 6px;
               font-size: 0.78rem; color: var(--sky); font-weight: 700;
               text-transform: uppercase; letter-spacing: 0.04em; }
  .made-line svg { width: 15px; height: 15px; flex-shrink: 0; }

  .honest { display: flex; gap: 10px; align-items: flex-start;
            background: var(--sand); border-radius: 14px;
            padding: 10px 14px; color: var(--wait);
            font-size: var(--fs-meta); font-weight: 600; }
  .honest svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }

  .unsure-head { display: flex; gap: 10px; align-items: center;
                 color: var(--clay); font-weight: 600; }
  .unsure-head svg { width: 24px; height: 24px; flex-shrink: 0; }
  .unsure-span { display: block; background: var(--clay-soft);
                 color: var(--ink); border-radius: 14px; padding: 12px 16px;
                 font-size: var(--fs-hero); line-height: 1.45; }

  .playtrack { height: 8px; border-radius: var(--radius-chip);
               background: var(--sand); overflow: hidden; }
  .playfill { height: 100%; width: 0; background: var(--sky);
              border-radius: inherit; }

  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; display: inline-flex; align-items: center;
                    justify-content: center; gap: 8px; font-weight: 600;
                    padding: 10px 12px; }
  .actions button svg { width: 22px; height: 22px; flex-shrink: 0; }
  .btn-hear { background: var(--sky-soft); color: var(--sky); border: none; }
  .btn-send { background: var(--marigold); color: #fff; border: none; }
  .btn-send:active { background: var(--marigold-deep); }
  .btn-again { width: 100%; display: inline-flex; align-items: center;
               justify-content: center; gap: 8px; font-weight: 600;
               background: var(--marigold); color: #fff; border: none; }
  .btn-again svg { width: 22px; height: 22px; }
  .btn-again:active { background: var(--marigold-deep); }

  h2 { font-size: var(--fs-meta); color: var(--ink-faint); font-weight: 700;
       text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 4px 0; }
  .sent-row { display: flex; align-items: center; gap: 10px;
              background: var(--card); border-radius: 14px;
              padding: 10px 14px; box-shadow: var(--shadow); }
  .sent-row .sent-text { flex: 1; min-width: 0; white-space: nowrap;
                         overflow: hidden; text-overflow: ellipsis;
                         color: var(--ink-soft); }

  .dock { position: fixed; bottom: 0; left: 0; right: 0;
          background: linear-gradient(transparent, var(--paper) 30%);
          padding: 22px 0 20px; display: flex; flex-direction: column;
          align-items: center; gap: 6px; }
  .mic { width: var(--tap-hero); height: var(--tap-hero); border-radius: 50%;
         background: var(--marigold); border: none; display: grid;
         place-items: center; box-shadow: var(--shadow);
         touch-action: none; }
  .mic svg { width: 40px; height: 40px; color: #fff; }
  .mic:active, .mic.listening { background: var(--marigold-deep); }
  @keyframes mic-pulse {
    from { box-shadow: 0 0 0 0 rgba(224, 123, 40, 0.45); }
    to   { box-shadow: 0 0 0 26px rgba(224, 123, 40, 0); }
  }
  .mic.listening { animation: mic-pulse 1.2s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .mic.listening { animation: none; }
  }
  .mic-label { font-size: var(--fs-meta); font-weight: 600;
               color: var(--ink-soft); }

  .devstrip { position: fixed; top: 0; right: 0; margin: 8px;
              display: flex; gap: 6px; opacity: 0.85; }
  .devstrip button { min-height: 36px; min-width: 0; font-size: 0.78rem;
                     padding: 4px 12px; border-radius: var(--radius-chip);
                     background: var(--ink); color: var(--paper);
                     border: none; }
</style>
</head>
<body>
<!--SPRITES-->
<div class="shell">
  <header>
    <div>
      <h1>Bol</h1>
      <span class="tag">Say it, send it written</span>
    </div>
    <span class="made-chip">
      <svg aria-hidden="true"><use href="#ic-sparkle"/></svg>
      Made on this phone
    </span>
    <span class="net-pill on" id="netPill" role="status">
      <svg style="width:16px;height:16px" aria-hidden="true">
        <use href="#ic-delivered"/></svg><span id="netWord">Connected</span>
    </span>
  </header>

  <div class="offline-banner" role="status">
    <svg style="width:22px;height:22px" aria-hidden="true">
      <use href="#ic-offline"/></svg>
    No internet right now. Everything here still works.
  </div>

  <main>
    <section id="drafts" aria-live="polite" aria-label="Your message"></section>
    <section id="sent" aria-label="Sent today"></section>
  </main>

  <div class="dock">
    <button class="mic" id="micBtn" aria-label="Hold to speak your message">
      <svg aria-hidden="true"><use href="#ic-mic"/></svg>
    </button>
    <span class="mic-label" id="micLabel" aria-live="polite">Hold to speak</span>
  </div>
</div>

<div class="devstrip" aria-label="demo controls">
  <button id="devNet">toggle network</button>
</div>

<template id="draftT">
  <article class="card">
    <div class="who">
      <svg class="sprite" aria-hidden="true"><use href="#peep-mother"/></svg>
      <span class="chip register"></span>
    </div>
    <p class="msg"></p>
    <span class="made-line">
      <svg aria-hidden="true"><use href="#ic-sparkle"/></svg>
      Made on this phone
    </span>
    <div class="honest" hidden>
      <svg aria-hidden="true"><use href="#ic-listen"/></svg>
      <span>I couldn't tidy this. These are your words, exactly.</span>
    </div>
    <div class="playtrack" hidden aria-hidden="true">
      <div class="playfill"></div>
    </div>
    <div class="actions">
      <button class="btn-hear">
        <svg aria-hidden="true"><use href="#ic-listen"/></svg>
        Hear it back
      </button>
      <button class="btn-send">Send it</button>
    </div>
  </article>
</template>

<template id="clarifyT">
  <article class="card">
    <div class="who">
      <svg class="sprite" aria-hidden="true"><use href="#peep-mother"/></svg>
      <span class="chip register"></span>
    </div>
    <div class="unsure-head">
      <svg aria-hidden="true"><use href="#ic-listen"/></svg>
      <span>I couldn't catch this part:</span>
    </div>
    <mark class="unsure-span"></mark>
    <button class="btn-again">
      <svg aria-hidden="true"><use href="#ic-mic"/></svg>
      Say that part again
    </button>
  </article>
</template>

<template id="sentT">
  <div class="sent-row">
    <span class="sent-text"></span>
    <span class="chip arrived">
      <svg aria-hidden="true"><use href="#ic-delivered"/></svg>
      Arrived
    </span>
  </div>
</template>

<script>
const RTL = new Set(["ur", "ar"]);
const REGISTER = {formal: "For the school", familiar: "For family"};
const reduceMotion =
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

async function api(path, body) {
  const res = await fetch(path, body ? {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)} : undefined);
  return res.json();
}

function setScript(el, text, lang) {
  el.textContent = text;
  el.setAttribute("lang", lang);
  if (RTL.has(lang)) el.setAttribute("dir", "rtl");
}

function uncertainSpan(d) {
  if (d.lowConfidenceSpan) return d.lowConfidenceSpan;
  const q = (d.clarifyPrompt || "").match(/“([^”]+)”/);
  return q ? q[1] : d.rawTranscript.split(/\s+/).slice(-3).join(" ");
}

function hearBack(card, btn, text) {
  const track = card.querySelector(".playtrack");
  const fill = card.querySelector(".playfill");
  const dur = reduceMotion ? 0 : Math.min(6000, 1200 + text.length * 45);
  btn.disabled = true;
  track.hidden = false;
  fill.style.transition = "none";
  fill.style.width = "0%";
  requestAnimationFrame(() => {
    fill.style.transition = dur ? `width ${dur}ms linear` : "none";
    fill.style.width = "100%";
  });
  setTimeout(() => { track.hidden = true; btn.disabled = false; },
             dur + 600);
}

function draftCard(d) {
  const c = document.getElementById("draftT").content.cloneNode(true);
  const card = c.querySelector(".card");
  c.querySelector(".chip.register").textContent =
    REGISTER[d.register] || d.register;
  const text = d.cleanText || d.rawTranscript;
  setScript(c.querySelector(".msg"), text, d.lang);
  if (d.composeMode === "fallback") {
    c.querySelector(".made-line").remove();  // no credit it did not earn
    c.querySelector(".honest").hidden = false;
  }
  const hear = c.querySelector(".btn-hear");
  hear.setAttribute("aria-label", "Hear it back, read aloud");
  hear.addEventListener("click", () => hearBack(card, hear, text));
  const send = c.querySelector(".btn-send");
  send.setAttribute("aria-label", "Send it");
  send.addEventListener("click", async () => {
    send.disabled = true;
    render(await api("/api/approve", {id: d.id}));
  });
  return c;
}

function clarifyCard(d) {
  const c = document.getElementById("clarifyT").content.cloneNode(true);
  c.querySelector(".chip.register").textContent =
    REGISTER[d.register] || d.register;
  setScript(c.querySelector(".unsure-span"), uncertainSpan(d), d.lang);
  const again = c.querySelector(".btn-again");
  again.addEventListener("click", async () => {
    again.disabled = true;
    again.lastChild.textContent = " Listening…";
    render(await api("/api/dictate", {retry: d.id}));
  });
  return c;
}

function render(state) {
  document.body.classList.toggle("offline", !state.online);
  const pill = document.getElementById("netPill");
  pill.className = "net-pill " + (state.online ? "on" : "off");
  pill.querySelector("use").setAttribute("href",
    state.online ? "#ic-delivered" : "#ic-offline");
  document.getElementById("netWord").textContent =
    state.online ? "Connected" : "Offline";

  const open = [], done = [];
  for (const d of state.drafts) (d.approved ? done : open).push(d);

  const draftsEl = document.getElementById("drafts");
  draftsEl.innerHTML = "";
  if (!open.length && !done.length) {
    draftsEl.innerHTML = `<div class="empty">
      <svg class="sprite sprite-lg" aria-hidden="true">
        <use href="#peep-mother"/></svg>
      <p>Hold the big button.</p>
      <p>Say your message.</p></div>`;
  }
  for (const d of open.reverse()) {
    draftsEl.appendChild(
      d.composeMode === "clarify" ? clarifyCard(d) : draftCard(d));
  }

  const sentEl = document.getElementById("sent");
  sentEl.innerHTML = "";
  if (done.length) {
    const h = document.createElement("h2");
    h.textContent = "Sent today";
    sentEl.appendChild(h);
    for (const d of done.reverse()) {
      const r = document.getElementById("sentT").content.cloneNode(true);
      setScript(r.querySelector(".sent-text"),
                d.cleanText || d.rawTranscript, d.lang);
      sentEl.appendChild(r);
    }
  }
}

const mic = document.getElementById("micBtn");
const micLabel = document.getElementById("micLabel");
let online = true, holding = false, busy = false;

function startListening() {
  if (busy || holding) return;
  holding = true;
  mic.classList.add("listening");
  micLabel.textContent = "Listening…";
}

async function finishListening() {
  if (!holding) return;
  holding = false;
  busy = true;
  // let the metaphor land even on a quick tap
  await new Promise(r => setTimeout(r, reduceMotion ? 0 : 450));
  const s = await api("/api/dictate", {});
  mic.classList.remove("listening");
  micLabel.textContent = "Here is your message";
  setTimeout(() => { micLabel.textContent = "Hold to speak"; }, 2200);
  render(s);
  busy = false;
}

mic.addEventListener("pointerdown", startListening);
mic.addEventListener("pointerup", finishListening);
mic.addEventListener("pointercancel", () => {
  holding = false;
  mic.classList.remove("listening");
  micLabel.textContent = "Hold to speak";
});
mic.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault();
    startListening(); }
});
mic.addEventListener("keyup", e => {
  if (e.key === " " || e.key === "Enter") finishListening();
});

document.getElementById("devNet").addEventListener("click", async () => {
  online = !online;
  render(await api("/api/network", {online}));
});

api("/api/state").then(s => { online = s.online; render(s); });
</script>
</body>
</html>
